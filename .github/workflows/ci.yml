name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev-lock.txt
      - name: Build frontend and check contracts
        run: |
          python tools/build_frontend.py
          python tools/backend/export_contracts.py
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript tests
        run: node --test tests/frontend_adapter.test.cjs tests/property_map.test.cjs
      - name: Fresh-storage HTTP release check
        shell: bash
        run: python tools/backend/verify_release.py --python "$(python -c 'import sys;print(sys.executable)')" --port 8003
