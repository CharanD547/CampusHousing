name: Roomwise CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roomwise-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python and browser-logic checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      ROOMWISE_EXTERNAL_ENABLED: "false"
      ROOMWISE_AI_PROVIDER: disabled
      ROOMWISE_MAPS_ENABLED: "false"
      ROOMWISE_PLACES_ENABLED: "false"
      ROOMWISE_ROUTES_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install locked application and test dependencies
        run: python -m pip install -r requirements-dev-lock.txt
      - name: Python regression and public model-package checks
        run: python -m pytest -q
      - name: Frontend behavior checks
        run: node --test tests/frontend_adapter.test.cjs tests/property_map.test.cjs
      - name: Rebuild frontend and API contracts
        run: |
          python tools/build_frontend.py
          python tools/backend/export_contracts.py
          git diff --exit-code -- CampusHousing-main/index.html contracts/v1.openapi.json
      - name: Fresh-storage HTTP release flow (no provider calls)
        run: python -c "from pathlib import Path; import sys; from tools.backend.verify_release import verify; print(verify(Path(sys.executable), port=8011))"
